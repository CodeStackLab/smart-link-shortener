<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020817">
  <title>Strong Link 64 Shotner — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/stronglink64_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/stronglink64_logo.png">
  <meta name="description" content="Create Account on Strong Link 64 Shotner — Register to get started.">

  <style>
    :root {
      --bg-dark: #020817;
      --cyan-bright: #00d2ff;
      --cyan-electric: #00f0ff;
      --blue-border: #0077e6;
      --blue-input-border: #0090ff;
      --neon-green: #00e676;
      --text-muted: #8ea8c9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 14%, rgba(0, 190, 255, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 10% 28%, rgba(0, 120, 255, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 90% 42%, rgba(0, 210, 255, 0.25) 0%, transparent 42%),
        radial-gradient(circle at 50% 92%, rgba(0, 150, 255, 0.32) 0%, transparent 50%),
        linear-gradient(180deg, #020612 0%, #030e26 50%, #020612 100%);
      background-attachment: fixed;
    }

    /* Ambient Silk Energy Waves (Contained 100% inside screen, NO horizontal overflow) */
    .ambient-waves-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-waves {
      width: 100%;
      height: 100%;
      display: block;
    }

    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 410px;
      margin: auto;
      padding: 24px 16px 28px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
    }

    /* Branding Typography */
    .brand-title {
      font-size: clamp(1.8rem, 6.2vw, 2.3rem);
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 2px;
      width: 100%;
    }

    .brand-title .num-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 22px rgba(0, 210, 255, 0.9);
    }

    .brand-subtitle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      width: 100%;
    }

    .subtitle-line {
      height: 2.2px;
      width: clamp(28px, 9vw, 44px);
      background: linear-gradient(90deg, transparent, var(--cyan-bright));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--cyan-bright);
    }

    .subtitle-line.right {
      background: linear-gradient(90deg, var(--cyan-bright), transparent);
    }

    .brand-subtitle {
      font-size: clamp(1.35rem, 4.8vw, 1.75rem);
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }

    /* Create Account Headings */
    .create-account-title {
      font-size: clamp(1.6rem, 5.5vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.4px;
      text-align: center;
      color: #ffffff;
      line-height: 1.2;
      margin-bottom: 3px;
      width: 100%;
    }

    .create-account-title .account-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 22px rgba(0, 210, 255, 0.9);
    }

    .create-account-sub {
      font-size: clamp(0.85rem, 2.8vw, 0.94rem);
      font-weight: 500;
      color: #94a3b8;
      letter-spacing: 0.4px;
      text-align: center;
      margin-bottom: 18px;
      width: 100%;
    }

    /* Error / Success Alert Banner */
    #register-alert {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.18);
      border: 1.5px solid rgba(239, 68, 68, 0.7);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fca5a5;
      text-align: center;
      margin-bottom: 14px;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    #register-alert.success {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.7);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    /* Double-Framed Inputs Stack (Exact Match to Login Page) */
    .inputs-outer-card {
      position: relative;
      width: 100%;
      max-width: 100%;
      background: rgba(3, 14, 38, 0.65);
      border: 2px solid var(--blue-border);
      border-radius: 20px;
      box-shadow: 
        0 0 22px rgba(0, 119, 230, 0.38),
        inset 0 0 14px rgba(0, 119, 230, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
      box-sizing: border-box;
    }

    /* Glowing Side Pins on Outer Frame */
    .neon-edge-pin {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 3.5px;
      height: 48px;
      background: var(--cyan-electric);
      box-shadow: 0 0 14px 3px var(--cyan-electric), 0 0 24px 6px rgba(0, 240, 255, 0.8);
      border-radius: 4px;
      z-index: 2;
    }

    .neon-edge-pin.pin-left {
      left: -2px;
    }

    .neon-edge-pin.pin-right {
      right: -2px;
    }

    /* Inner Input Boxes */
    .input-box {
      display: flex;
      align-items: center;
      background: rgba(2, 12, 30, 0.85);
      border: 1.8px solid var(--blue-input-border);
      border-radius: 14px;
      box-shadow: 0 0 12px rgba(0, 144, 255, 0.3);
      padding: 10px 12px;
      gap: 10px;
      transition: all 0.2s ease;
      position: relative;
      box-sizing: border-box;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }

    .input-box:focus-within {
      border-color: var(--cyan-bright);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.65), inset 0 0 8px rgba(0, 210, 255, 0.2);
    }

    .input-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-icon {
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8));
    }

    .lock-icon {
      filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.85));
    }

    .input-field {
      flex: 1;
      width: 100%;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .input-field::placeholder {
      color: #8da6c7;
      font-weight: 500;
      opacity: 0.95;
    }

    .input-field:-webkit-autofill,
    .input-field:-webkit-autofill:hover, 
    .input-field:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px rgba(4, 18, 42, 0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f9bbd;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .password-toggle-btn svg {
      width: 20px;
      height: 20px;
      display: block;
    }

    .password-toggle-btn:hover,
    .password-toggle-btn.active {
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px var(--cyan-bright));
    }

    /* Big Glowing Register Button */
    .register-btn {
      width: 100%;
      height: 52px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(180deg, #00d2ff 0%, #0088ff 55%, #0066ee 100%);
      box-shadow: 
        0 0 32px rgba(0, 200, 255, 0.9),
        0 4px 20px rgba(0, 100, 255, 0.55),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
      margin-bottom: 18px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      box-sizing: border-box;
    }

    .register-btn:hover {
      background: linear-gradient(180deg, #2ae0ff 0%, #0099ff 55%, #0077ff 100%);
      box-shadow: 
        0 0 42px rgba(0, 230, 255, 1),
        0 4px 24px rgba(0, 120, 255, 0.75);
      transform: translateY(-1px);
    }

    .register-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .register-btn.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer text */
    .login-footer-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      letter-spacing: 0.2px;
      margin-bottom: 18px;
      width: 100%;
    }

    .login-link {
      color: var(--cyan-bright);
      font-weight: 700;
      text-decoration: none;
      margin-left: 6px;
      transition: all 0.2s ease;
    }

    .login-link:hover {
      text-shadow: 0 0 12px var(--cyan-bright);
      text-decoration: underline;
    }

    /* Powered by Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
    }

    .footer-label {
      font-size: 0.82rem;
      color: #6a8cb0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .footer-brand svg {
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.8));
    }
  </style>
</head>
<body>

  <!-- Ambient background curves (Contained 100% inside viewport) -->
  <div class="ambient-waves-wrap">
    <svg class="ambient-waves" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0066ff" stop-opacity="0.1"/>
          <stop offset="20%" stop-color="#00aaff" stop-opacity="0.8"/>
          <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
          <stop offset="80%" stop-color="#0099ff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#0055ff" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="ribbonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur1"/>
          <feGaussianBlur stdDeviation="18" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M 0 320 C 140 280, 260 160, 360 40 C 420 0, 520 -40, 600 -80" stroke="url(#cyanRibbon)" stroke-width="4" filter="url(#ribbonGlow)"/>
      <path d="M 1440 80 C 1280 220, 1140 400, 1260 580 C 1340 700, 1440 820, 1440 900" stroke="url(#cyanRibbon)" stroke-width="4" filter="url(#ribbonGlow)"/>
      <path d="M 0 620 C 100 720, 220 840, 380 900" stroke="url(#cyanRibbon)" stroke-width="4.5" filter="url(#ribbonGlow)"/>
      <path d="M 1440 680 C 1360 740, 1180 840, 1020 900" stroke="url(#cyanRibbon)" stroke-width="5" filter="url(#ribbonGlow)"/>
    </svg>
  </div>

  <div class="register-container">
    <!-- Brand Header -->
    <h1 class="brand-title">Strong Link <span class="num-accent">64</span></h1>
    <div class="brand-subtitle-row">
      <div class="subtitle-line"></div>
      <span class="brand-subtitle">Shotner</span>
      <div class="subtitle-line right"></div>
    </div>

    <!-- Create Account Headings -->
    <h2 class="create-account-title">Create <span class="account-accent">Account</span></h2>
    <p class="create-account-sub">Register to get started</p>

    <!-- Error / Success Alert Banner -->
    <div id="register-alert" role="alert"></div>

    <!-- Registration Form -->
    <form id="register-form" style="width:100%;" autocomplete="on">
      <!-- Double-Framed Inputs Stack -->
      <div class="inputs-outer-card">
        <div class="neon-edge-pin pin-left"></div>
        <div class="neon-edge-pin pin-right"></div>

        <!-- Username Box -->
        <div class="input-box">
          <div class="input-icon user-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="User name" 
            autocomplete="username" 
            required 
            spellcheck="false"
            minlength="3"
          >
        </div>

        <!-- Password Box -->
        <div class="input-box">
          <div class="input-icon lock-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="10" width="16" height="12" rx="3" fill="#0088ff" stroke="#00e5ff" stroke-width="2"/>
              <path d="M7 10V6.5a5 5 0 0 1 10 0V10" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M12 14v4M12 14l-1.5 1.5M12 14l1.5 1.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="Password" 
            autocomplete="new-password"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false" 
            required
            minlength="5"
          >
          <button type="button" id="password-toggle-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="#7f9bbd">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>

        <!-- Confirm Password Box -->
        <div class="input-box">
          <div class="input-icon lock-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="10" width="16" height="12" rx="3" fill="#0088ff" stroke="#00e5ff" stroke-width="2"/>
              <path d="M7 10V6.5a5 5 0 0 1 10 0V10" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M12 14v4M12 14l-1.5 1.5M12 14l1.5 1.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirmPassword" 
            class="input-field" 
            placeholder="Confirm Password" 
            autocomplete="new-password"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false" 
            required
            minlength="5"
          >
          <button type="button" id="confirm-password-toggle-btn" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
            <svg id="confirm-eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="#7f9bbd">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Register Button -->
      <button type="submit" id="register-btn" class="register-btn">
        <span id="btn-text">Register</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </form>

    <!-- Already have an account? Login -->
    <div class="login-footer-text">
      Already have an account? <a href="/login" class="login-link">Login</a>
    </div>

    <!-- Powered by Footer -->
    <div class="footer">
      <div class="footer-label">Powered by</div>
      <div class="footer-brand">
        <svg width="28" height="16" viewBox="0 0 32 18" fill="none">
          <path d="M10 3C6.13 3 3 6.13 3 10C3 13.87 6.13 17 10 17C12.8 17 15.22 15.35 16.32 12.98C15.5 11.8 14.88 10.5 14.48 9.13C13.67 6.64 12 3 10 3ZM22 3C20 3 18.33 6.64 17.52 9.13C17.12 10.5 16.5 11.8 15.68 12.98C16.78 15.35 19.2 17 22 17C25.87 17 29 13.87 29 10C29 6.13 25.87 3 22 3Z" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Strong Link 64</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("register-form");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const confirmPasswordInput = document.getElementById("confirm-password");
      const passToggleBtn = document.getElementById("password-toggle-btn");
      const confirmPassToggleBtn = document.getElementById("confirm-password-toggle-btn");
      const eyeIcon = document.getElementById("eye-icon");
      const confirmEyeIcon = document.getElementById("confirm-eye-icon");
      const registerBtn = document.getElementById("register-btn");
      const btnText = document.getElementById("btn-text");
      const btnSpinner = document.getElementById("btn-spinner");
      const alertBox = document.getElementById("register-alert");

      // SVG Icon helper for Eye Open / Closed
      const eyeOpenSvg = "<path d=\"M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z\"/>";
      const eyeClosedSvg = "<path d=\"M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z\"/>";

      // Password Toggle Logic
      if (passToggleBtn && passwordInput && eyeIcon) {
        passToggleBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const isPass = passwordInput.getAttribute("type") === "password";
          passwordInput.setAttribute("type", isPass ? "text" : "password");
          eyeIcon.innerHTML = isPass ? eyeClosedSvg : eyeOpenSvg;
          passToggleBtn.classList.toggle("active", isPass);
        });
      }

      // Confirm Password Toggle Logic
      if (confirmPassToggleBtn && confirmPasswordInput && confirmEyeIcon) {
        confirmPassToggleBtn.addEventListener("click", (e) => {
          e.preventDefault();
          const isPass = confirmPasswordInput.getAttribute("type") === "password";
          confirmPasswordInput.setAttribute("type", isPass ? "text" : "password");
          confirmEyeIcon.innerHTML = isPass ? eyeClosedSvg : eyeOpenSvg;
          confirmPassToggleBtn.classList.toggle("active", isPass);
        });
      }

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.className = isSuccess ? "success" : "";
        alertBox.style.display = "block";
      }

      function hideAlert() {
        if (!alertBox) return;
        alertBox.style.display = "none";
      }

      function setLoading(loading) {
        if (loading) {
          registerBtn.classList.add("loading");
          btnText.style.display = "none";
          btnSpinner.style.display = "block";
        } else {
          registerBtn.classList.remove("loading");
          btnText.style.display = "block";
          btnSpinner.style.display = "none";
        }
      }

      // Handle Form Submit
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideAlert();

        const username = (usernameInput.value || "").trim();
        const password = (passwordInput.value || "").trim();
        const confirmPassword = (confirmPasswordInput.value || "").trim();

        if (!username) {
          showAlert("Please enter a username.");
          usernameInput.focus();
          return;
        }

        if (username.length < 3) {
          showAlert("Username must be at least 3 characters long.");
          usernameInput.focus();
          return;
        }

        if (!password) {
          showAlert("Please enter a password.");
          passwordInput.focus();
          return;
        }

        if (password.length < 5) {
          showAlert("Password must be at least 5 characters long.");
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showAlert("Passwords do not match. Please re-enter confirm password.");
          confirmPasswordInput.focus();
          return;
        }

        setLoading(true);

        try {
          const res = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password, confirmPassword })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            try {
              localStorage.setItem('cachedIsSuperAdmin', 'false');
              localStorage.setItem('cachedUserRole', 'Editor');
              localStorage.setItem('cachedUsername', data.username || '');
              localStorage.setItem('cachedUserBadge', '👤 ' + (data.username || ''));
              localStorage.setItem('cachedPermissions', JSON.stringify(data.permissions || ['facebook', 'instagram', 'custom_website', 'links', 'upload_image', 'settings', 'analytics']));
            } catch (e) {}
            showAlert("🎉 Account created successfully! Redirecting...", true);
            setTimeout(() => {
              window.location.href = data.redirect || "/admin";
            }, 800);
          } else {
            showAlert(data.error || "Registration failed. Please try again.");
            setLoading(false);
          }
        } catch (err) {
          showAlert("Connection error. Please check internet connection.");
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
