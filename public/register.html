<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030914">
  <title>Strong Link 64 Shotner — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/stronglink64_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/stronglink64_logo.png">
  <meta name="description" content="Create Account on Strong Link 64 Shotner — Register to get started.">

  <style>
    :root {
      --bg-dark: #020713;
      --cyan-bright: #00d2ff;
      --cyan-glow: rgba(0, 210, 255, 0.6);
      --blue-primary: #0077ff;
      --neon-green: #00ff88;
      --border-blue: #0094ff;
      --card-bg: rgba(4, 18, 42, 0.72);
      --text-muted: #8aa4c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(0, 190, 255, 0.28) 0%, transparent 48%),
        radial-gradient(circle at 10% 28%, rgba(0, 110, 255, 0.25) 0%, transparent 42%),
        radial-gradient(circle at 90% 40%, rgba(0, 210, 255, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(0, 140, 255, 0.3) 0%, transparent 50%),
        linear-gradient(180deg, #020612 0%, #041026 50%, #020612 100%);
      background-attachment: fixed;
    }

    /* Ambient background wave ribbons matching design */
    .bg-wave-ribbon {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .ribbon-1 {
      top: -50px;
      left: -120px;
      width: 450px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(0, 140, 255, 0.35) 0%, transparent 70%);
      filter: blur(55px);
    }

    .ribbon-2 {
      bottom: -80px;
      right: -100px;
      width: 480px;
      height: 480px;
      background: radial-gradient(ellipse at center, rgba(0, 210, 255, 0.28) 0%, transparent 70%);
      filter: blur(55px);
    }

    .ambient-curves {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }

    .register-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 16px 20px 32px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation with Back Arrow */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 2px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      text-decoration: none;
      transition: transform 0.2s ease, opacity 0.2s ease, color 0.2s ease;
      opacity: 0.95;
    }

    .back-btn:hover {
      transform: translateX(-4px);
      color: var(--cyan-bright);
      opacity: 1;
    }

    /* Logo Area */
    .logo-wrapper {
      position: relative;
      margin-bottom: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 135px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 24px rgba(0, 210, 255, 0.95));
      animation: pulse-glow 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0% {
        filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.8)) drop-shadow(0 0 8px rgba(0, 130, 255, 0.5));
      }
      100% {
        filter: drop-shadow(0 0 34px rgba(0, 235, 255, 1)) drop-shadow(0 0 16px rgba(0, 160, 255, 0.7));
      }
    }

    /* Branding Typography */
    .brand-title {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .brand-title .num-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.85);
    }

    .brand-subtitle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
      width: 100%;
    }

    .subtitle-line {
      height: 2.2px;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--cyan-bright));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--cyan-bright);
    }

    .subtitle-line.right {
      background: linear-gradient(90deg, var(--cyan-bright), transparent);
    }

    .brand-subtitle {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }

    /* Screen Headings */
    .create-account-title {
      font-size: 2.15rem;
      font-weight: 800;
      color: #ffffff;
      text-align: center;
      margin-bottom: 3px;
      letter-spacing: -0.5px;
    }

    .account-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 22px rgba(0, 210, 255, 0.9);
    }

    .create-account-sub {
      font-size: 0.95rem;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 22px;
    }

    /* Alert Banner */
    #register-alert {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.18);
      border: 1.5px solid rgba(239, 68, 68, 0.7);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fca5a5;
      text-align: center;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    #register-alert.success {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.7);
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    /* Form Container Box */
    .form-box {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-blue);
      border-radius: 20px;
      box-shadow: 
        0 0 24px rgba(0, 144, 255, 0.42),
        inset 0 0 16px rgba(0, 144, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .input-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 14px;
      position: relative;
    }

    .input-row:not(:last-child) {
      border-bottom: 1.5px solid rgba(0, 144, 255, 0.35);
    }

    .input-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6));
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .input-field::placeholder {
      color: #8da9cb;
      font-weight: 500;
      opacity: 0.95;
    }

    .input-field:-webkit-autofill,
    .input-field:-webkit-autofill:hover, 
    .input-field:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px rgba(4, 18, 42, 0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8da9cb;
      transition: color 0.2s ease, filter 0.2s ease;
      flex-shrink: 0;
    }

    .password-toggle-btn:hover,
    .password-toggle-btn.active {
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8));
    }

    /* Big Glowing Register Button */
    .register-btn {
      width: 100%;
      height: 54px;
      border-radius: 27px;
      border: none;
      background: linear-gradient(180deg, #00d2ff 0%, #006aff 100%);
      box-shadow: 
        0 0 30px rgba(0, 195, 255, 0.8),
        0 4px 18px rgba(0, 106, 255, 0.5);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
      margin-bottom: 22px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .register-btn:hover {
      background: linear-gradient(180deg, #24ddff 0%, #007aff 100%);
      box-shadow: 
        0 0 38px rgba(0, 220, 255, 1),
        0 4px 22px rgba(0, 120, 255, 0.65);
      transform: translateY(-1px);
    }

    .register-btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 
        0 0 20px rgba(0, 180, 255, 0.7),
        0 2px 10px rgba(0, 80, 255, 0.4);
    }

    .register-btn.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer text */
    .login-footer-text {
      font-size: 0.95rem;
      font-weight: 500;
      color: #94a3b8;
      text-align: center;
      letter-spacing: 0.1px;
    }

    .login-link {
      color: var(--cyan-bright);
      font-weight: 700;
      text-decoration: none;
      margin-left: 4px;
      transition: all 0.2s ease;
    }

    .login-link:hover {
      text-shadow: 0 0 12px var(--cyan-bright);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Orbs -->
  <div class="bg-wave-ribbon ribbon-1"></div>
  <div class="bg-wave-ribbon ribbon-2"></div>

  <!-- SVG Laser Curves -->
  <svg class="ambient-curves" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M-100 200 C 300 120, 600 480, 1540 100" stroke="url(#cyan-grad-1)" stroke-width="2.5" opacity="0.38"/>
    <path d="M-100 280 C 400 320, 800 100, 1540 380" stroke="url(#cyan-grad-2)" stroke-width="2" opacity="0.25"/>
    <path d="M-100 780 C 500 500, 900 850, 1540 600" stroke="url(#blue-grad-1)" stroke-width="2.8" opacity="0.3"/>
    <defs>
      <linearGradient id="cyan-grad-1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#00d2ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#006aff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="cyan-grad-2" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#0088ff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00d2ff" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#0044ff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="blue-grad-1" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#006aff" stop-opacity="0"/>
        <stop offset="50%" stop-color="#00aaff" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
      </linearGradient>
    </defs>
  </svg>

  <div class="register-container">

    <!-- Top Bar with Back Arrow -->
    <div class="top-nav">
      <a href="/login" class="back-btn" aria-label="Back to Login">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </a>
    </div>

    <!-- Center Glowing Logo -->
    <div class="logo-wrapper">
      <img src="/images/stronglink64_logo.png" alt="Strong Link 64 Logo" class="logo-img">
    </div>

    <!-- Typography Branding -->
    <h1 class="brand-title">Strong Link <span class="num-accent">64</span></h1>
    <div class="brand-subtitle-row">
      <div class="subtitle-line"></div>
      <span class="brand-subtitle">Shotner</span>
      <div class="subtitle-line right"></div>
    </div>

    <!-- Screen Headings -->
    <h2 class="create-account-title">Create <span class="account-accent">Account</span></h2>
    <p class="create-account-sub">Register to get started</p>

    <!-- Error / Success Alert Banner -->
    <div id="register-alert" role="alert"></div>

    <!-- Registration Form -->
    <form id="register-form" style="width:100%;" autocomplete="on">
      <div class="form-box">
        
        <!-- User name Input Row -->
        <div class="input-row">
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="User name" 
            autocomplete="username" 
            required 
            spellcheck="false"
            minlength="3"
          >
        </div>

        <!-- Password Input Row -->
        <div class="input-row">
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="Password" 
            autocomplete="new-password" 
            required
            minlength="5"
          >
          <button type="button" id="password-toggle-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

        <!-- Confirm Password Input Row -->
        <div class="input-row">
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input 
            type="password" 
            id="confirm-password" 
            name="confirmPassword" 
            class="input-field" 
            placeholder="Confirm Password" 
            autocomplete="new-password" 
            required
            minlength="5"
          >
          <button type="button" id="confirm-password-toggle-btn" class="password-toggle-btn" aria-label="Toggle confirm password visibility">
            <svg id="confirm-eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

      </div>

      <!-- Register Button -->
      <button type="submit" id="register-btn" class="register-btn">
        <span id="btn-text">Register</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </form>

    <!-- Already have an account? Login -->
    <div class="login-footer-text">
      Already have an account? <a href="/login" class="login-link">Login</a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('register-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirm-password');
      const passToggleBtn = document.getElementById('password-toggle-btn');
      const confirmPassToggleBtn = document.getElementById('confirm-password-toggle-btn');
      const eyeIcon = document.getElementById('eye-icon');
      const confirmEyeIcon = document.getElementById('confirm-eye-icon');
      const registerBtn = document.getElementById('register-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const alertBox = document.getElementById('register-alert');

      // SVG Icon helper for Eye Open / Closed
      const eyeOpenSvg = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      const eyeClosedSvg = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';

      // Password Toggle Logic
      if (passToggleBtn && passwordInput && eyeIcon) {
        passToggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const isPass = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPass ? 'text' : 'password');
          eyeIcon.innerHTML = isPass ? eyeClosedSvg : eyeOpenSvg;
          passToggleBtn.classList.toggle('active', isPass);
        });
      }

      // Confirm Password Toggle Logic
      if (confirmPassToggleBtn && confirmPasswordInput && confirmEyeIcon) {
        confirmPassToggleBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const isPass = confirmPasswordInput.getAttribute('type') === 'password';
          confirmPasswordInput.setAttribute('type', isPass ? 'text' : 'password');
          confirmEyeIcon.innerHTML = isPass ? eyeClosedSvg : eyeOpenSvg;
          confirmPassToggleBtn.classList.toggle('active', isPass);
        });
      }

      function showAlert(msg, isSuccess = false) {
        if (!alertBox) return;
        alertBox.textContent = msg;
        alertBox.className = isSuccess ? 'success' : '';
        alertBox.style.display = 'block';
      }

      function hideAlert() {
        if (!alertBox) return;
        alertBox.style.display = 'none';
      }

      function setLoading(loading) {
        if (loading) {
          registerBtn.classList.add('loading');
          btnText.style.display = 'none';
          btnSpinner.style.display = 'block';
        } else {
          registerBtn.classList.remove('loading');
          btnText.style.display = 'block';
          btnSpinner.style.display = 'none';
        }
      }

      // Handle Form Submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideAlert();

        const username = (usernameInput.value || '').trim();
        const password = (passwordInput.value || '').trim();
        const confirmPassword = (confirmPasswordInput.value || '').trim();

        if (!username) {
          showAlert('Please enter a username.');
          usernameInput.focus();
          return;
        }

        if (username.length < 3) {
          showAlert('Username must be at least 3 characters long.');
          usernameInput.focus();
          return;
        }

        if (!password) {
          showAlert('Please enter a password.');
          passwordInput.focus();
          return;
        }

        if (password.length < 5) {
          showAlert('Password must be at least 5 characters long.');
          passwordInput.focus();
          return;
        }

        if (password !== confirmPassword) {
          showAlert('Passwords do not match. Please re-enter confirm password.');
          confirmPasswordInput.focus();
          return;
        }

        setLoading(true);

        try {
          const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, confirmPassword })
          });

          const data = await res.json();

          if (res.ok && data.success) {
            showAlert('🎉 Account created successfully! Redirecting...', true);
            setTimeout(() => {
              window.location.href = data.redirect || '/admin';
            }, 800);
          } else {
            showAlert(data.error || 'Registration failed. Please try again.');
            setLoading(false);
          }
        } catch (err) {
          showAlert('Connection error. Please check internet connection.');
          setLoading(false);
        }
      });
    });
  </script>
</body>
</html>
