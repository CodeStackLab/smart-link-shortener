<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#030914">
  <title>Strong Link 64 Shotner — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/stronglink64_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/stronglink64_logo.png">
  <meta name="description" content="Strong Link 64 Shotner — Shorten, Track, Grow. Intelligent link redirection engine.">

  <style>
    :root {
      --bg-dark: #020713;
      --cyan-bright: #00d2ff;
      --cyan-glow: rgba(0, 210, 255, 0.6);
      --blue-primary: #0077ff;
      --neon-green: #00ff88;
      --border-blue: #0094ff;
      --card-bg: rgba(4, 18, 42, 0.72);
      --text-muted: #8aa4c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Outfit', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 12%, rgba(0, 190, 255, 0.28) 0%, transparent 48%),
        radial-gradient(circle at 10% 28%, rgba(0, 110, 255, 0.25) 0%, transparent 42%),
        radial-gradient(circle at 90% 40%, rgba(0, 210, 255, 0.22) 0%, transparent 40%),
        radial-gradient(circle at 50% 95%, rgba(0, 140, 255, 0.3) 0%, transparent 50%),
        linear-gradient(180deg, #020612 0%, #041026 50%, #020612 100%);
      background-attachment: fixed;
    }

    /* Ambient background wave ribbons matching design */
    .bg-wave-ribbon {
      position: absolute;
      pointer-events: none;
      z-index: 0;
    }

    .ribbon-1 {
      top: -50px;
      left: -120px;
      width: 450px;
      height: 450px;
      background: radial-gradient(ellipse at center, rgba(0, 140, 255, 0.35) 0%, transparent 70%);
      filter: blur(55px);
    }

    .ribbon-2 {
      bottom: -80px;
      right: -100px;
      width: 480px;
      height: 480px;
      background: radial-gradient(ellipse at center, rgba(0, 210, 255, 0.28) 0%, transparent 70%);
      filter: blur(55px);
    }

    .ambient-curves {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.75;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 16px 20px 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Bar */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 4px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.95;
    }

    .back-btn:hover {
      transform: translateX(-3px);
      opacity: 1;
    }

    /* Logo Area */
    .logo-wrapper {
      position: relative;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 140px;
      height: auto;
      object-fit: contain;
      
      filter: drop-shadow(0 0 24px rgba(0, 210, 255, 0.95));
      animation: pulse-glow 3.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      0% {
        filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.8)) drop-shadow(0 0 8px rgba(0, 130, 255, 0.5));
      }
      100% {
        filter: drop-shadow(0 0 34px rgba(0, 235, 255, 1)) drop-shadow(0 0 16px rgba(0, 160, 255, 0.7));
      }
    }

    /* Branding Typography */
    .brand-title {
      font-size: 2.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 4px;
    }

    .brand-title .num-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 20px rgba(0, 210, 255, 0.85);
    }

    .brand-subtitle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 4px;
      width: 100%;
    }

    .subtitle-line {
      height: 2.2px;
      width: 48px;
      background: linear-gradient(90deg, transparent, var(--cyan-bright));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--cyan-bright);
    }

    .subtitle-line.right {
      background: linear-gradient(90deg, var(--cyan-bright), transparent);
    }

    .brand-subtitle {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }

    .brand-tagline {
      font-size: 0.86rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.6px;
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-tagline .dot {
      color: var(--cyan-bright);
      margin: 0 5px;
    }

    /* Alert Banner */
    #login-alert {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.18);
      border: 1.5px solid rgba(239, 68, 68, 0.7);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fca5a5;
      text-align: center;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    /* Form Container Box */
    .form-box {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-blue);
      border-radius: 20px;
      box-shadow: 
        0 0 24px rgba(0, 144, 255, 0.42),
        inset 0 0 16px rgba(0, 144, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      overflow: hidden;
      margin-bottom: 18px;
    }

    .input-row {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      gap: 14px;
      position: relative;
    }

    .input-row:not(:last-child) {
      border-bottom: 1.5px solid rgba(0, 144, 255, 0.35);
    }

    .input-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.6));
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.02rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .input-field::placeholder {
      color: #8da9cb;
      font-weight: 500;
      opacity: 0.95;
    }

    .input-field:-webkit-autofill,
    .input-field:-webkit-autofill:hover, 
    .input-field:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px rgba(4, 18, 42, 0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8da9cb;
      transition: color 0.2s ease, filter 0.2s ease;
      flex-shrink: 0;
    }

    .password-toggle-btn:hover,
    .password-toggle-btn.active {
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8));
    }

    /* Big Glowing Login Button */
    .login-btn {
      width: 100%;
      height: 54px;
      border-radius: 27px;
      border: none;
      background: linear-gradient(180deg, #00d2ff 0%, #006aff 100%);
      box-shadow: 
        0 0 30px rgba(0, 195, 255, 0.8),
        0 4px 18px rgba(0, 106, 255, 0.5);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
      margin-bottom: 20px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .login-btn:hover {
      background: linear-gradient(180deg, #24ddff 0%, #007aff 100%);
      box-shadow: 
        0 0 38px rgba(0, 220, 255, 1),
        0 4px 22px rgba(0, 120, 255, 0.65);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(1px) scale(0.99);
      box-shadow: 
        0 0 20px rgba(0, 180, 255, 0.7),
        0 2px 10px rgba(0, 80, 255, 0.4);
    }

    .login-btn.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* WhatsApp Action Card */
    .contact-card {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-blue);
      border-radius: 28px;
      box-shadow: 
        0 0 22px rgba(0, 144, 255, 0.38),
        inset 0 0 12px rgba(0, 144, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 9px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: all 0.22s ease;
      margin-bottom: 16px;
    }

    .contact-card:hover {
      border-color: #00b4ff;
      box-shadow: 
        0 0 30px rgba(0, 180, 255, 0.6),
        inset 0 0 16px rgba(0, 180, 255, 0.18);
      transform: translateY(-1px);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .whatsapp-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.7);
      flex-shrink: 0;
    }

    .whatsapp-badge svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .card-divider {
      width: 1.5px;
      height: 36px;
      background: rgba(0, 144, 255, 0.45);
      border-radius: 2px;
      margin: 0 10px;
      flex-shrink: 0;
    }

    .card-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.25;
      white-space: nowrap;
    }

    .card-info .label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .card-info .number {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--neon-green);
      letter-spacing: 0.4px;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.55);
    }

    .card-right-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px var(--cyan-bright));
    }

    /* OR Divider */
    .or-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 14px;
      margin: 2px 0 16px 0;
    }

    .or-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(0, 144, 255, 0.6), transparent);
    }

    .or-text {
      font-size: 0.85rem;
      font-weight: 800;
      color: #7b9abf;
      letter-spacing: 1px;
    }

    /* JazzCash Card */
    .jazzcash-card {
      width: 100%;
      background: var(--card-bg);
      border: 2px solid var(--border-blue);
      border-radius: 28px;
      box-shadow: 
        0 0 22px rgba(0, 144, 255, 0.38),
        inset 0 0 12px rgba(0, 144, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.22s ease;
      margin-bottom: 24px;
      position: relative;
    }

    .jazzcash-card:hover {
      border-color: #00b4ff;
      box-shadow: 
        0 0 30px rgba(0, 180, 255, 0.6),
        inset 0 0 16px rgba(0, 180, 255, 0.18);
      transform: translateY(-1px);
    }

    .jazzcash-logo-img {
      height: 38px;
      width: auto;
      object-fit: contain;
      
      filter: drop-shadow(0 0 10px rgba(255, 50, 0, 0.5));
    }

    .jazzcash-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      line-height: 1.25;
      white-space: nowrap;
    }

    .jazzcash-info .label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    .jazzcash-info .number {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--neon-green);
      letter-spacing: 0.4px;
      text-shadow: 0 0 14px rgba(0, 255, 136, 0.55);
    }

    /* Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-label {
      font-size: 0.78rem;
      color: #6a8cb0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 0.98rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .footer-brand svg {
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.8));
    }

    /* Copy Toast Notification */
    #copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(4, 24, 52, 0.95);
      border: 1.5px solid var(--neon-green);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.55);
      border-radius: 20px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    #copy-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 360px) {
      .login-container {
        padding: 14px 12px;
      }
      .brand-title {
        font-size: 1.9rem;
      }
      .brand-subtitle {
        font-size: 1.45rem;
      }
      .card-info .number,
      .jazzcash-info .number {
        font-size: 1.02rem;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient background glow elements -->
  <div class="bg-wave-ribbon ribbon-1"></div>
  <div class="bg-wave-ribbon ribbon-2"></div>

  <svg class="ambient-curves" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
    <path d="M-100,180 C300,40 600,420 1200,90 C1400,-10 1600,300 1700,520" stroke="rgba(0, 170, 255, 0.35)" stroke-width="2.5" filter="blur(4px)"/>
    <path d="M-50,620 C400,820 800,430 1300,870 C1500,970 1700,740 1800,820" stroke="rgba(0, 220, 255, 0.32)" stroke-width="2" filter="blur(3px)"/>
    <path d="M200,-60 C500,320 900,80 1500,360" stroke="rgba(0, 130, 255, 0.28)" stroke-width="2"/>
  </svg>

  <div class="login-container">
    
    <!-- Top Navigation Bar -->
    <div class="top-nav">
      <button type="button" class="back-btn" onclick="if(history.length > 1){history.back();}else{window.location.href='/';}" aria-label="Go back">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
      </button>
    </div>

    <!-- Center Glowing Logo -->
    <div class="logo-wrapper">
      <img src="/images/stronglink64_logo.png" alt="Strong Link 64 Logo" class="logo-img">
    </div>

    <!-- Typography Branding -->
    <h1 class="brand-title">Strong Link <span class="num-accent">64</span></h1>
    <div class="brand-subtitle-row">
      <div class="subtitle-line"></div>
      <span class="brand-subtitle">Shotner</span>
      <div class="subtitle-line right"></div>
    </div>
    <p class="brand-tagline">Shorten <span class="dot">•</span> Track <span class="dot">•</span> Grow</p>

    <!-- Error Alert Banner -->
    <div id="login-alert" role="alert"></div>

    <!-- Form Container -->
    <form id="login-form" style="width:100%;" autocomplete="on">
      <div class="form-box">
        
        <!-- User name Input Row -->
        <div class="input-row">
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="User name" 
            autocomplete="username" 
            required 
            spellcheck="false"
          >
        </div>

        <!-- Password Input Row -->
        <div class="input-row">
          <div class="input-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="Password" 
            autocomplete="current-password" 
            required
          >
          <button type="button" id="password-toggle-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>

      </div>

      <!-- Login Button -->
      <button type="submit" id="login-btn" class="login-btn">
        <span id="btn-text">Login</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </form>

    <!-- WhatsApp Me Card -->
    <a href="https://wa.me/923071234567?text=Hello%20Strong%20Link%2064%20Support" target="_blank" rel="noopener noreferrer" class="contact-card" id="whatsapp-card">
      <div class="card-left">
        <div class="whatsapp-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm5.79 14.12c-.24.67-1.39 1.29-1.93 1.37-.5.08-1.15.11-3.32-.78-2.77-1.15-4.54-3.97-4.68-4.16-.14-.18-1.12-1.49-1.12-2.84 0-1.35.71-2.02.96-2.29.25-.27.55-.34.73-.34.18 0 .37 0 .53.01.17.01.4.06.61.56.22.53.75 1.83.82 1.96.07.14.12.3.02.49-.09.19-.14.3-.28.46-.14.16-.3.35-.43.47-.14.14-.29.29-.12.58.17.29.75 1.24 1.61 2.01 1.11.99 2.05 1.3 2.34 1.44.29.14.46.12.63-.07.17-.19.73-.85.92-1.15.19-.29.39-.24.65-.15.26.1 1.66.78 1.95.92.29.14.49.22.56.34.07.12.07.72-.17 1.39z"/>
          </svg>
        </div>
      </div>
      <div class="card-divider"></div>
      <div class="card-info">
        <span class="label">WhatsApp Me</span>
        <span class="number" id="whatsapp-num">0307 1234567</span>
      </div>
      <div class="card-divider"></div>
      <div class="card-right-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18l6-6-6-6"/>
        </svg>
      </div>
    </a>

    <!-- OR Divider -->
    <div class="or-divider">
      <div class="or-line"></div>
      <span class="or-text">OR</span>
      <div class="or-line"></div>
    </div>

    <!-- JazzCash Card -->
    <div class="jazzcash-card" id="jazzcash-btn" role="button" tabindex="0" title="Click to copy JazzCash number">
      <img src="/images/jazzcash_logo.png" alt="JazzCash" class="jazzcash-logo-img">
      <div class="card-divider"></div>
      <div class="jazzcash-info">
        <span class="label">JazzCash Number</span>
        <span class="number" id="jazzcash-num">0307 1234567</span>
      </div>
      <div class="card-divider"></div>
      <img src="/images/jazzcash_logo.png" alt="JazzCash" class="jazzcash-logo-img">
    </div>

    <!-- Powered by Footer -->
    <div class="footer">
      <span class="footer-label">Powered by</span>
      <div class="footer-brand">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Strong Link 64</span>
      </div>
    </div>

  </div>

  <!-- Toast for copying number -->
  <div id="copy-toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span>JazzCash Number Copied!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('password-toggle-btn');
      const eyeIcon = document.getElementById('eye-icon');
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const jazzcashBtn = document.getElementById('jazzcash-btn');
      const copyToast = document.getElementById('copy-toast');

      // Password Toggle Visibility
      let showPassword = false;
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          showPassword = !showPassword;
          passwordInput.type = showPassword ? 'text' : 'password';
          toggleBtn.classList.toggle('active', showPassword);
          if (showPassword) {
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
          } else {
            eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
          }
        });
      }

      // Check if session already active
      fetch('/api/session')
        .then(res => res.json())
        .then(data => {
          if (data && data.authenticated) {
            window.location.href = '/admin';
          }
        })
        .catch(() => {});

      // Auto-fill credentials & auto-login from Direct Invite Link (?u=...&p=...)
      const urlParams = new URLSearchParams(window.location.search);
      const paramUser = urlParams.get('u') || urlParams.get('user') || urlParams.get('username');
      const paramPass = urlParams.get('p') || urlParams.get('pass') || urlParams.get('password');

      if (paramUser && usernameInput) usernameInput.value = paramUser;
      if (paramPass && passwordInput) passwordInput.value = paramPass;
      if (paramUser && paramPass && form) {
        setTimeout(() => {
          form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }, 300);
      }

      // Dynamic Contact Info Loader
      async function loadContactInfo() {
        try {
          const res = await fetch('/api/public/contact-info');
          if (!res.ok) return;
          const data = await res.json();
          const waCard = document.getElementById('whatsapp-card');
          const waEl = document.getElementById('whatsapp-num');

          if (data && data.whatsappNumber) {
            const waNum = data.whatsappNumber;
            if (waEl) waEl.textContent = waNum;
            const waClean = waNum.replace(/[^0-9]/g, '');
            const waIntl = waClean.startsWith('0') ? ('92' + waClean.slice(1)) : waClean;
            if (waCard) {
              if (data.whatsappUrl && data.whatsappUrl.trim()) {
                waCard.href = data.whatsappUrl.trim();
              } else {
                waCard.href = 'https://wa.me/' + waIntl + '?text=Hello%20Strong%20Link%2064%20Support';
              }
            }
          } else if (data && data.whatsappUrl && data.whatsappUrl.trim()) {
            if (waCard) waCard.href = data.whatsappUrl.trim();
          }

          if (data && data.jazzcashNumber) {
            const jcNum = data.jazzcashNumber;
            const jcEl = document.getElementById('jazzcash-num');
            if (jcEl) jcEl.textContent = jcNum;
            window._currentJazzcashNum = jcNum;
          }
        } catch (e) {}
      }
      loadContactInfo();

      // Copy JazzCash number
      function copyJazzCash() {
        const fullNum = window._currentJazzcashNum || document.getElementById('jazzcash-num')?.textContent || '0307 1234567';
        const num = fullNum.replace(/[^0-9]/g, '');
        navigator.clipboard.writeText(num).then(() => {
          showToast('JazzCash Number ' + fullNum + ' Copied!');
        }).catch(() => {
          showToast('JazzCash: ' + fullNum);
        });
      }

      if (jazzcashBtn) {
        jazzcashBtn.addEventListener('click', copyJazzCash);
        jazzcashBtn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            copyJazzCash();
          }
        });
      }

      function showToast(text) {
        if (!copyToast) return;
        copyToast.querySelector('span').textContent = text;
        copyToast.classList.add('show');
        setTimeout(() => {
          copyToast.classList.remove('show');
        }, 2500);
      }

      // Hide alert on input
      [usernameInput, passwordInput].forEach(inp => {
        if (inp) {
          inp.addEventListener('input', () => {
            if (alertBox) alertBox.style.display = 'none';
          });
        }
      });

      // Handle form submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (alertBox) alertBox.style.display = 'none';

        const username = (usernameInput?.value || '').trim();
        const password = (passwordInput?.value || '').trim();

        if (!username) {
          alertBox.textContent = 'Please enter username';
          alertBox.style.display = 'block';
          usernameInput.focus();
          return;
        }

        if (!password) {
          alertBox.textContent = 'Please enter password';
          alertBox.style.display = 'block';
          passwordInput.focus();
          return;
        }

        // Set Loading state
        loginBtn.classList.add('loading');
        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            try {
              const uName = (data.username || username).trim();
              const uRole = (data.role || 'Admin').trim();
              const isMaster = (typeof data.isSuperAdmin === 'boolean')
                ? data.isSuperAdmin
                : (uName.toLowerCase() === 'admin' || uName.toLowerCase() === 'master admin' || uRole.toLowerCase() === 'super admin');
              const icon = (isMaster || uRole === 'Admin') ? '🛡️' : '👤';
              const formattedName = uName ? uName.replace(/\b\w/g, c => c.toUpperCase()) : '';
              const badgeText = isMaster ? '🛡️ Master Admin' : (icon + ' ' + formattedName);
              localStorage.setItem('cachedIsSuperAdmin', isMaster ? 'true' : 'false');
              localStorage.setItem('cachedUserBadge', badgeText);
              localStorage.setItem('cachedUserRole', uRole);
              localStorage.setItem('cachedUsername', uName);
              localStorage.setItem('cachedPermissions', JSON.stringify(data.permissions || []));
            } catch (err) {}
            window.location.href = '/admin';
          } else {
            loginBtn.classList.remove('loading');
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
            alertBox.textContent = data.error || 'Invalid username or password';
            alertBox.style.display = 'block';
          }
        } catch (err) {
          loginBtn.classList.remove('loading');
          btnText.style.display = 'block';
          btnSpinner.style.display = 'none';
          alertBox.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
