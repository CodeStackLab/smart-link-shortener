<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#020817">
  <title>Strong Link 64 Shotner — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/images/stronglink64_logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/images/stronglink64_logo.png">
  <meta name="description" content="Strong Link 64 Shotner — Shorten, Track, Grow. Intelligent link redirection engine.">

  <style>
    :root {
      --bg-dark: #020817;
      --cyan-bright: #00d2ff;
      --cyan-electric: #00f0ff;
      --blue-border: #0077e6;
      --blue-input-border: #0090ff;
      --neon-green: #00e676;
      --text-muted: #8ea8c9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 14%, rgba(0, 190, 255, 0.32) 0%, transparent 48%),
        radial-gradient(circle at 10% 28%, rgba(0, 120, 255, 0.28) 0%, transparent 45%),
        radial-gradient(circle at 90% 42%, rgba(0, 210, 255, 0.25) 0%, transparent 42%),
        radial-gradient(circle at 50% 92%, rgba(0, 150, 255, 0.32) 0%, transparent 50%),
        linear-gradient(180deg, #020612 0%, #030e26 50%, #020612 100%);
      background-attachment: fixed;
    }

    /* Ambient Silk Energy Waves matching screenshot */
    .ambient-waves-wrap {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .ambient-waves {
      width: 100%;
      height: 100%;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 490px;
      padding: 20px 16px 36px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation */
    .top-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 4px;
    }

    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0.95;
    }

    .back-btn:hover {
      transform: translateX(-3px);
      opacity: 1;
    }

    /* Center Glowing Logo */
    .logo-wrapper {
      position: relative;
      margin-bottom: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-img {
      width: 155px;
      height: auto;
      object-fit: contain;
      mix-blend-mode: screen;
      filter: drop-shadow(0 0 25px rgba(0, 210, 255, 0.95)) drop-shadow(0 0 10px rgba(0, 150, 255, 0.8));
      animation: logo-glow-pulse 3.5s ease-in-out infinite alternate;
    }

    @keyframes logo-glow-pulse {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 20px rgba(0, 200, 255, 0.85)) drop-shadow(0 0 8px rgba(0, 130, 255, 0.6));
      }
      100% {
        transform: scale(1.02);
        filter: drop-shadow(0 0 35px rgba(0, 235, 255, 1)) drop-shadow(0 0 16px rgba(0, 170, 255, 0.9));
      }
    }

    /* Typography Branding */
    .brand-title {
      font-size: 2.35rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-align: center;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 2px;
    }

    .brand-title .num-accent {
      color: var(--cyan-bright);
      text-shadow: 0 0 22px rgba(0, 210, 255, 0.9);
    }

    .brand-subtitle-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 5px;
      width: 100%;
    }

    .subtitle-line {
      height: 2.2px;
      width: 50px;
      background: linear-gradient(90deg, transparent, var(--cyan-bright));
      border-radius: 2px;
      box-shadow: 0 0 10px var(--cyan-bright);
    }

    .subtitle-line.right {
      background: linear-gradient(90deg, var(--cyan-bright), transparent);
    }

    .brand-subtitle {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: #ffffff;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.25);
    }

    .brand-tagline {
      font-size: 0.92rem;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.8px;
      text-align: center;
      margin-bottom: 20px;
    }

    .brand-tagline .dot {
      color: #94a3b8;
      margin: 0 6px;
    }

    /* Error Alert Banner */
    #login-alert {
      display: none;
      width: 100%;
      background: rgba(239, 68, 68, 0.18);
      border: 1.5px solid rgba(239, 68, 68, 0.7);
      box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 700;
      color: #fca5a5;
      text-align: center;
      margin-bottom: 16px;
      backdrop-filter: blur(10px);
    }

    /* Inputs Double-Framed Card */
    .inputs-outer-card {
      position: relative;
      width: 100%;
      background: rgba(3, 14, 38, 0.65);
      border: 2px solid var(--blue-border);
      border-radius: 20px;
      box-shadow: 
        0 0 22px rgba(0, 119, 230, 0.38),
        inset 0 0 14px rgba(0, 119, 230, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* Glowing Side Pins on Outer Frame */
    .neon-edge-pin {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 3.5px;
      height: 46px;
      background: var(--cyan-electric);
      box-shadow: 0 0 14px 3px var(--cyan-electric), 0 0 24px 6px rgba(0, 240, 255, 0.8);
      border-radius: 4px;
      z-index: 2;
    }

    .neon-edge-pin.pin-left {
      left: -2.5px;
    }

    .neon-edge-pin.pin-right {
      right: -2.5px;
    }

    /* Inner Input Boxes */
    .input-box {
      display: flex;
      align-items: center;
      background: rgba(2, 12, 30, 0.85);
      border: 1.8px solid var(--blue-input-border);
      border-radius: 14px;
      box-shadow: 0 0 12px rgba(0, 144, 255, 0.3);
      padding: 12px 16px;
      gap: 14px;
      transition: all 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--cyan-bright);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.65), inset 0 0 8px rgba(0, 210, 255, 0.2);
    }

    .input-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-icon {
      filter: drop-shadow(0 0 8px rgba(0, 210, 255, 0.8));
    }

    .lock-icon {
      filter: drop-shadow(0 0 8px rgba(0, 180, 255, 0.85));
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.2px;
    }

    .input-field::placeholder {
      color: #8da6c7;
      font-weight: 500;
      opacity: 0.95;
    }

    .input-field:-webkit-autofill,
    .input-field:-webkit-autofill:hover, 
    .input-field:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff;
      -webkit-box-shadow: 0 0 0px 1000px rgba(4, 18, 42, 0.95) inset;
      transition: background-color 5000s ease-in-out 0s;
    }

    .password-toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #7f9bbd;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .password-toggle-btn:hover,
    .password-toggle-btn.active {
      color: var(--cyan-bright);
      filter: drop-shadow(0 0 8px var(--cyan-bright));
    }

    /* Big Glowing Login Button */
    .login-btn {
      width: 100%;
      height: 56px;
      border-radius: 9999px;
      border: none;
      background: linear-gradient(180deg, #00d2ff 0%, #0088ff 55%, #0066ee 100%);
      box-shadow: 
        0 0 32px rgba(0, 200, 255, 0.9),
        0 4px 20px rgba(0, 100, 255, 0.55),
        inset 0 1px 2px rgba(255, 255, 255, 0.6);
      color: #ffffff;
      font-family: inherit;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.22s ease;
      margin-bottom: 16px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .login-btn:hover {
      background: linear-gradient(180deg, #2ae0ff 0%, #0099ff 55%, #0077ff 100%);
      box-shadow: 
        0 0 42px rgba(0, 230, 255, 1),
        0 4px 24px rgba(0, 120, 255, 0.75);
      transform: translateY(-1px);
    }

    .login-btn:active {
      transform: translateY(1px) scale(0.99);
    }

    .login-btn.loading {
      opacity: 0.8;
      pointer-events: none;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Pill Action Cards (WhatsApp & JazzCash) */
    .pill-card {
      width: 100%;
      background: rgba(2, 14, 38, 0.7);
      border: 2px solid #00aaff;
      border-radius: 9999px;
      box-shadow: 
        0 0 24px rgba(0, 170, 255, 0.45),
        inset 0 0 12px rgba(0, 170, 255, 0.15);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 8px 18px;
      display: block;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: all 0.22s ease;
      user-select: none;
    }

    .pill-card:hover {
      border-color: #00d2ff;
      box-shadow: 
        0 0 34px rgba(0, 210, 255, 0.7),
        inset 0 0 16px rgba(0, 210, 255, 0.22);
      transform: translateY(-1px);
    }

    .pill-card-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .whatsapp-badge {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #25D366;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px rgba(37, 211, 102, 0.8);
      flex-shrink: 0;
    }

    .whatsapp-badge svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .pill-divider {
      width: 1.5px;
      height: 38px;
      background: #0077cc;
      border-radius: 2px;
      margin: 0 12px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .pill-text-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      line-height: 1.25;
      padding-left: 4px;
    }

    .pill-text-col.center-align {
      text-align: center;
      padding-left: 0;
    }

    .pill-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.2px;
    }

    .pill-text-col.center-align .pill-label {
      font-size: 0.88rem;
      font-weight: 600;
      color: #cbd5e1;
    }

    .pill-number {
      font-size: 1.28rem;
      font-weight: 800;
      color: var(--neon-green);
      letter-spacing: 0.4px;
      text-shadow: 0 0 16px rgba(0, 230, 118, 0.6);
    }

    .pill-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px #00d2ff);
    }

    /* OR Divider */
    .or-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: 14px;
      margin: 14px 0;
    }

    .or-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(0, 144, 255, 0.6), transparent);
    }

    .or-text {
      font-size: 0.88rem;
      font-weight: 800;
      color: #7b9abf;
      letter-spacing: 1.5px;
    }

    /* JazzCash Card */
    .jc-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
      filter: drop-shadow(0 0 8px rgba(255, 60, 0, 0.5));
    }

    /* Footer */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 22px;
    }

    .footer-label {
      font-size: 0.82rem;
      color: #6a8cb0;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .footer-brand svg {
      filter: drop-shadow(0 0 10px rgba(0, 210, 255, 0.8));
    }

    /* Register Subtle Link */
    .register-subtle {
      margin-top: 12px;
      text-align: center;
    }

    .register-subtle a {
      color: #64748b;
      font-size: 0.84rem;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s ease;
    }

    .register-subtle a:hover {
      color: var(--cyan-bright);
    }

    /* Copy Toast Notification */
    #copy-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: rgba(4, 24, 52, 0.95);
      border: 1.5px solid var(--neon-green);
      box-shadow: 0 0 22px rgba(0, 255, 136, 0.55);
      border-radius: 20px;
      padding: 10px 22px;
      font-size: 0.9rem;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    #copy-toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient background curves -->
  <div class="ambient-waves-wrap">
    <svg class="ambient-waves" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="none">
      <defs>
        <linearGradient id="cyanRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0066ff" stop-opacity="0.1"/>
          <stop offset="20%" stop-color="#00aaff" stop-opacity="0.8"/>
          <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
          <stop offset="80%" stop-color="#0099ff" stop-opacity="0.7"/>
          <stop offset="100%" stop-color="#0055ff" stop-opacity="0.1"/>
        </linearGradient>
        <filter id="ribbonGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="6" result="blur1"/>
          <feGaussianBlur stdDeviation="18" result="blur2"/>
          <feMerge>
            <feMergeNode in="blur2"/>
            <feMergeNode in="blur1"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path d="M -80 320 C 120 280, 260 160, 360 40 C 420 -30, 520 -80, 600 -120" stroke="url(#cyanRibbon)" stroke-width="4" filter="url(#ribbonGlow)"/>
      <path d="M 1520 80 C 1280 220, 1140 400, 1260 580 C 1340 700, 1480 820, 1560 920" stroke="url(#cyanRibbon)" stroke-width="4" filter="url(#ribbonGlow)"/>
      <path d="M -120 620 C 80 720, 220 840, 380 960" stroke="url(#cyanRibbon)" stroke-width="4.5" filter="url(#ribbonGlow)"/>
      <path d="M 1540 680 C 1360 740, 1180 840, 1020 960" stroke="url(#cyanRibbon)" stroke-width="5" filter="url(#ribbonGlow)"/>
    </svg>
  </div>

  <div class="login-container">
    <!-- Brand Header -->
    <h1 class="brand-title">Strong Link <span class="num-accent">64</span></h1>
    <div class="brand-subtitle-row">
      <div class="subtitle-line"></div>
      <span class="brand-subtitle">Shotner</span>
      <div class="subtitle-line right"></div>
    </div>
    <p class="brand-tagline">Shorten <span class="dot">•</span> Track <span class="dot">•</span> Grow</p>

    <!-- Error Alert Banner -->
    <div id="login-alert" role="alert"></div>

    <!-- Form Container -->
    <form id="login-form" style="width:100%;" autocomplete="on">
      <!-- Double-Framed Inputs Stack -->
      <div class="inputs-outer-card">
        <div class="neon-edge-pin pin-left"></div>
        <div class="neon-edge-pin pin-right"></div>

        <div class="input-box">
          <div class="input-icon user-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="User name" 
            autocomplete="username" 
            required 
            spellcheck="false"
          >
        </div>

        <div class="input-box">
          <div class="input-icon lock-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <rect x="4" y="10" width="16" height="12" rx="3" fill="#0088ff" stroke="#00e5ff" stroke-width="2"/>
              <path d="M7 10V6.5a5 5 0 0 1 10 0V10" stroke="#00e5ff" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M12 14v4M12 14l-1.5 1.5M12 14l1.5 1.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="Password" 
            autocomplete="current-password" 
            required
          >
          <button type="button" id="password-toggle-btn" class="password-toggle-btn" aria-label="Toggle password visibility">
            <svg id="eye-icon" width="22" height="22" viewBox="0 0 24 24" fill="#7f9bbd">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button type="submit" id="login-btn" class="login-btn">
        <span id="btn-text">Login</span>
        <div class="spinner" id="btn-spinner"></div>
      </button>
    </form>

    <!-- WhatsApp Me Card -->
    <a href="https://wa.me/923071234567?text=Hello%20Strong%20Link%2064%20Support" target="_blank" rel="noopener noreferrer" class="pill-card" id="whatsapp-card">
      <div class="pill-card-inner">
        <div class="whatsapp-badge">
          <svg viewBox="0 0 24 24">
            <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91C2.13 13.66 2.59 15.36 3.45 16.86L2.05 22L7.3 20.62C8.75 21.41 10.38 21.83 12.04 21.83C17.5 21.83 21.95 17.38 21.95 11.92C21.95 9.27 20.92 6.78 19.05 4.91C17.18 3.03 14.69 2 12.04 2ZM12.04 20.16C10.56 20.16 9.11 19.76 7.85 19.01L7.55 18.83L4.43 19.65L5.26 16.61L5.06 16.29C4.24 14.99 3.8 13.47 3.8 11.91C3.8 7.37 7.5 3.67 12.04 3.67C14.25 3.67 16.31 4.53 17.87 6.09C19.42 7.65 20.28 9.72 20.28 11.92C20.28 16.46 16.58 20.16 12.04 20.16ZM16.56 14.39C16.31 14.27 15.09 13.67 14.86 13.58C14.64 13.5 14.47 13.46 14.31 13.71C14.14 13.96 13.66 14.52 13.52 14.69C13.37 14.86 13.23 14.88 12.98 14.76C12.73 14.63 11.93 14.37 10.98 13.52C10.24 12.86 9.74 12.04 9.6 11.79C9.45 11.54 9.58 11.41 9.71 11.28C9.82 11.17 9.96 10.99 10.08 10.84C10.21 10.7 10.25 10.59 10.33 10.43C10.41 10.26 10.37 10.12 10.31 9.99C10.25 9.87 9.76 8.66 9.55 8.16C9.35 7.67 9.15 7.74 8.99 7.73C8.84 7.72 8.67 7.72 8.51 7.72C8.34 7.72 8.07 7.78 7.84 8.03C7.62 8.28 6.98 8.87 6.98 10.08C6.98 11.29 7.86 12.46 7.99 12.63C8.11 12.8 9.73 15.29 12.2 16.35C12.79 16.61 13.25 16.76 13.61 16.87C14.2 17.06 14.74 17.03 15.17 16.97C15.65 16.9 16.64 16.37 16.85 15.79C17.05 15.2 17.05 14.71 16.99 14.6C16.93 14.49 16.8 14.51 16.56 14.39Z"/>
          </svg>
        </div>
        <div class="pill-divider"></div>
        <div class="pill-text-col">
          <div class="pill-label">WhatsApp Me</div>
          <div class="pill-number" id="whatsapp-num">0307 1234567</div>
        </div>
        <div class="pill-divider"></div>
        <div class="pill-arrow">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </div>
      </div>
    </a>

    <!-- OR Divider -->
    <div class="or-divider" id="or-divider" style="display:none;">
      <div class="or-line"></div>
      <span class="or-text">OR</span>
      <div class="or-line"></div>
    </div>

    <!-- JazzCash Card -->
    <div class="pill-card" id="jazzcash-btn" role="button" tabindex="0" style="display:none;">
      <div class="pill-card-inner">
        <img src="/images/jazzcash_logo.png" alt="JazzCash" class="jc-logo">
        <div class="pill-divider"></div>
        <div class="pill-text-col center-align">
          <div class="pill-label">JazzCash Number</div>
          <div class="pill-number" id="jazzcash-num">0307 1234567</div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-label">Powered by</div>
      <div class="footer-brand">
        <svg width="28" height="16" viewBox="0 0 32 18" fill="none">
          <path d="M10 3C6.13 3 3 6.13 3 10C3 13.87 6.13 17 10 17C12.8 17 15.22 15.35 16.32 12.98C15.5 11.8 14.88 10.5 14.48 9.13C13.67 6.64 12 3 10 3ZM22 3C20 3 18.33 6.64 17.52 9.13C17.12 10.5 16.5 11.8 15.68 12.98C16.78 15.35 19.2 17 22 17C25.87 17 29 13.87 29 10C29 6.13 25.87 3 22 3Z" stroke="#00d2ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Strong Link 64</span>
      </div>
    </div>

    <!-- Register Subtle Link -->
    <div class="register-subtle">
      <a href="/register">New user? <span style="color:#00d2ff; font-weight:600;">Create Account</span></a>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="copy-toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--neon-green)" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span>Number Copied!</span>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const toggleBtn = document.getElementById('password-toggle-btn');
      const eyeIcon = document.getElementById('eye-icon');
      const loginBtn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      const btnSpinner = document.getElementById('btn-spinner');
      const jazzcashBtn = document.getElementById('jazzcash-btn');
      const copyToast = document.getElementById('copy-toast');

      // Password Toggle Visibility
      let showPassword = false;
      if (toggleBtn) {
        toggleBtn.addEventListener('click', () => {
          showPassword = !showPassword;
          passwordInput.type = showPassword ? 'text' : 'password';
          toggleBtn.classList.toggle('active', showPassword);
          if (showPassword) {
            eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
          } else {
            eyeIcon.innerHTML = '<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>';
          }
        });
      }

      // Check if session already active
      fetch('/api/session')
        .then(res => res.json())
        .then(data => {
          if (data && data.authenticated) {
            window.location.href = '/admin';
          }
        })
        .catch(() => {});

      // Auto-fill credentials & auto-login from Direct Invite Link (?u=...&p=...)
      const urlParams = new URLSearchParams(window.location.search);
      const paramUser = urlParams.get('u') || urlParams.get('user') || urlParams.get('username');
      const paramPass = urlParams.get('p') || urlParams.get('pass') || urlParams.get('password');

      if (paramUser && usernameInput) usernameInput.value = paramUser;
      if (paramPass && passwordInput) passwordInput.value = paramPass;
      if (paramUser && paramPass && form) {
        setTimeout(() => {
          form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }, 300);
      }

      // Dynamic Contact Info Loader
      async function loadContactInfo() {
        try {
          const res = await fetch('/api/public/contact-info');
          if (!res.ok) return;
          const data = await res.json();
          const waCard = document.getElementById('whatsapp-card');
          const waEl = document.getElementById('whatsapp-num');

          if (data && data.whatsappNumber) {
            const waNum = data.whatsappNumber;
            if (waEl) waEl.textContent = waNum;
            const waClean = waNum.replace(/[^0-9]/g, '');
            const waIntl = waClean.startsWith('0') ? ('92' + waClean.slice(1)) : waClean;
            if (waCard) {
              if (data.whatsappUrl && data.whatsappUrl.trim()) {
                waCard.href = data.whatsappUrl.trim();
              } else {
                waCard.href = 'https://wa.me/' + waIntl + '?text=Hello%20Strong%20Link%2064%20Support';
              }
            }
          } else if (data && data.whatsappUrl && data.whatsappUrl.trim()) {
            if (waCard) waCard.href = data.whatsappUrl.trim();
          }

          if (data && data.jazzcashNumber) {
            const jcNum = data.jazzcashNumber;
            const jcEl = document.getElementById('jazzcash-num');
            if (jcEl) jcEl.textContent = jcNum;
            window._currentJazzcashNum = jcNum;
          }

          // Show / Hide JazzCash card and OR divider based on Admin Settings control
          const orDivider = document.getElementById('or-divider');
          const jcCard = document.getElementById('jazzcash-btn');
          if (data && data.showJazzcash === true) {
            if (orDivider) orDivider.style.display = 'flex';
            if (jcCard) jcCard.style.display = 'block';
          } else {
            if (orDivider) orDivider.style.display = 'none';
            if (jcCard) jcCard.style.display = 'none';
          }
        } catch (e) {}
      }
      loadContactInfo();

      // Copy JazzCash number
      function copyJazzCash() {
        const fullNum = window._currentJazzcashNum || document.getElementById('jazzcash-num')?.textContent || '0307 1234567';
        const num = fullNum.replace(/[^0-9]/g, '');
        navigator.clipboard.writeText(num).then(() => {
          showToast('JazzCash Number ' + fullNum + ' Copied!');
        }).catch(() => {
          showToast('JazzCash: ' + fullNum);
        });
      }

      if (jazzcashBtn) {
        jazzcashBtn.addEventListener('click', copyJazzCash);
        jazzcashBtn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            copyJazzCash();
          }
        });
      }

      function showToast(text) {
        if (!copyToast) return;
        copyToast.querySelector('span').textContent = text;
        copyToast.classList.add('show');
        setTimeout(() => {
          copyToast.classList.remove('show');
        }, 2500);
      }

      // Hide alert on input
      [usernameInput, passwordInput].forEach(inp => {
        if (inp) {
          inp.addEventListener('input', () => {
            if (alertBox) alertBox.style.display = 'none';
          });
        }
      });

      // Handle form submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (alertBox) alertBox.style.display = 'none';

        const username = (usernameInput?.value || '').trim();
        const password = (passwordInput?.value || '').trim();

        if (!username) {
          alertBox.textContent = 'Please enter username';
          alertBox.style.display = 'block';
          usernameInput.focus();
          return;
        }

        if (!password) {
          alertBox.textContent = 'Please enter password';
          alertBox.style.display = 'block';
          passwordInput.focus();
          return;
        }

        // Set Loading state
        loginBtn.classList.add('loading');
        btnText.style.display = 'none';
        btnSpinner.style.display = 'block';

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await response.json();

          if (response.ok && data.success) {
            try {
              const uName = (data.username || username).trim();
              const uRole = (data.role || 'Admin').trim();
              const isMaster = (typeof data.isSuperAdmin === 'boolean')
                ? data.isSuperAdmin
                : (uName.toLowerCase() === 'admin' || uName.toLowerCase() === 'master admin' || uRole.toLowerCase() === 'super admin');
              const icon = (isMaster || uRole === 'Admin') ? '🛡️' : '👤';
              const formattedName = uName ? uName.replace(/\w/g, c => c.toUpperCase()) : '';
              const badgeText = isMaster ? '🛡️ Master Admin' : (icon + ' ' + formattedName);
              localStorage.setItem('cachedIsSuperAdmin', isMaster ? 'true' : 'false');
              localStorage.setItem('cachedUserBadge', badgeText);
              localStorage.setItem('cachedUserRole', uRole);
              localStorage.setItem('cachedUsername', uName);
              localStorage.setItem('cachedPermissions', JSON.stringify(data.permissions || []));
            } catch (err) {}
            window.location.href = '/admin';
          } else {
            loginBtn.classList.remove('loading');
            btnText.style.display = 'block';
            btnSpinner.style.display = 'none';
            alertBox.textContent = data.error || 'Invalid username or password';
            alertBox.style.display = 'block';
          }
        } catch (err) {
          loginBtn.classList.remove('loading');
          btnText.style.display = 'block';
          btnSpinner.style.display = 'none';
          alertBox.textContent = 'Network error. Please try again.';
          alertBox.style.display = 'block';
        }
      });
    });
  </script>
</body>
</html>
