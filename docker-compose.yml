version: '3.8'

services:
  link-shortener-link64:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: link-shortener-link64
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3002:3000"
